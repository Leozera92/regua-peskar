plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.peskar.regua'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.peskar.regua'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7-video'
    }

    // Chave fixa de teste: permite instalar versões novas por cima, sem desinstalar.
    signingConfigs {
        peskar {
            storeFile file('peskar-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.peskar
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
